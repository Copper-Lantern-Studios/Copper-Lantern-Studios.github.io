<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copper Lantern Studios</title>
    <meta name="description" content="Copper Lantern Studios creates software, games, and educational tools including Lantern Canvas, a logic gate simulator and CPU simulator for computer science education.">
    <link rel="canonical" href="https://copperlanternstudios.com/">

    <style>
        :root {
            --background: #030405;
            --copper: #ab501c;
            --text: #f3e7dc;
            --muted: #a89586;
            --border: #2b1a10;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
        }

        .container img {
            max-width: 600px;
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .tagline {
            color: var(--copper);
            font-size: 0.95rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--copper);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.7rem 1.1rem;
        }

        .links a:hover {
            background: rgba(171, 80, 28, 0.12);
        }

        footer {
            text-align: center;
            padding: 1.25rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            margin: 0 0.4rem;
        }

        footer a:hover {
            color: var(--copper);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <img src="logo.png" alt="Copper Lantern Studios">
            <div class="tagline">Apps | Games | Tools</div>
            <div class="links">
                <a href="/lantern-canvas/">Explore Lantern Canvas</a>
            </div>
        </div>
    </main>

    <footer>
        <a href="/support/">Support</a>
        |
        <a href="/lantern-canvas/">Lantern Canvas</a>
        |
        <a href="/privacy/">Privacy</a>
    </footer>
</body>
</html>
